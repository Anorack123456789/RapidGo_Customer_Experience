services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka-init
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Esperando a que Kafka inicie...'
      sleep 15
      echo 'Creando tópico rapidgo.customer_feedback con 3 particiones...'
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:19092 --partitions 3 --replication-factor 1 --topic rapidgo.customer_feedback
      echo 'Configuración de Kafka completada.'
      "
      
  init-permissions:
    image: alpine:3.22
    container_name: rapidgo-init-permissions
    user: "0:0"
    volumes:
      - ./data:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        echo "Preparando directorios compartidos..."

        mkdir -p /data/datalake/raw
        mkdir -p /data/datalake/processed
        mkdir -p /data/datalake/curated
        mkdir -p /data/checkpoints
        mkdir -p /data/reports

        echo "Asignando el grupo compartido 185..."

        chown -R 185:185 /data/datalake
        chown -R 185:185 /data/checkpoints

        echo "Configurando permisos..."

        chmod -R g+rwX /data/datalake
        chmod -R g+rwX /data/checkpoints

        find /data/datalake -type d -exec chmod g+s {} \;
        find /data/checkpoints -type d -exec chmod g+s {} \;

        chown -R 50000:0 /data/reports
        chmod -R u+rwX /data/reports

        echo "Inicializacion de permisos completada."

  spark-master:
    image: spark:4.2.0-python3
    hostname: spark-master
    container_name: rapidgo-spark-master
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
    depends_on:
      kafka:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully

  spark-worker-1:
    image: spark:4.2.0-python3
    hostname: spark-worker-1
    container_name: rapidgo-spark-worker-1
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 768m --webui-port 8081
    ports:
      - "8081:8081"
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
    depends_on:
      spark-master:
        condition: service_started

  spark-worker-2:
    image: spark:4.2.0-python3
    hostname: spark-worker-2
    container_name: rapidgo-spark-worker-2
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 1 --memory 768m --webui-port 8081
    ports:
      - "8082:8081"
    volumes:
      - ./src:/opt/spark/work-dir/src
      - ./data:/opt/spark/work-dir/data
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
    depends_on:
      spark-master:
        condition: service_started
    
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: rapidgo-airflow:3.3.2
    hostname: airflow
    container_name: rapidgo-airflow
    command: bash -c "umask 0002 && exec airflow standalone"
    group_add:
      - "185"
    ports:
      - "8083:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "America/Bogota"
      RAPIDGO_RAW_PATH: "/opt/airflow/data/datalake/processed"
      RAPIDGO_CURATED_PATH: "/opt/airflow/data/datalake/curated"
      RAPIDGO_REPORT_PATH: "/opt/airflow/data/reports"
    volumes:
      - ./airflow:/opt/airflow
      - ./data:/opt/airflow/data
    depends_on:
      init-permissions:
        condition: service_completed_successfully