services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'

  kafka-init:
    image: apache/kafka:4.3.1
    container_name: rapidgo-kafka-init
    depends_on:
      - kafka
    command:
      - bash
      - -c
      - |
        echo "Esperando a que Kafka inicie..."
        while ! /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list; do
          echo "Kafka no está listo aún. Reintentando en 3 segundos..."
          sleep 3
        done
        echo "Kafka está listo. Creando tópico rapidgo.customer_feedback con 3 particiones..."
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:19092 --partitions 3 --replication-factor 1 --topic rapidgo.customer_feedback
        echo "Configuración de Kafka completada."
      
  init-permissions:
    image: alpine:3.22
    container_name: rapidgo-init-permissions
    user: "0:0"
    volumes:
      - ./datalake:/datalake
      - spark-ivy:/ivy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        mkdir -p /datalake/raw
        mkdir -p /datalake/processed
        mkdir -p /datalake/curated/alertas
        mkdir -p /datalake/curated/kpis
        mkdir -p /datalake/checkpoints/processed
        mkdir -p /datalake/checkpoints/rating
        mkdir -p /datalake/reports

        mkdir -p /ivy/cache /ivy/jars
        chown -R 185:185 /ivy
        chmod -R 775 /ivy

        chown -R 185:185 /datalake
        chmod -R g+rwX /datalake

        find /datalake -type d -exec chmod g+s {} \;

        echo "Permisos del Data Lake configurados."

  spark-master:
    image: spark:4.2.0-python3
    hostname: spark-master
    container_name: rapidgo-spark-master
    environment:
      HOME: /opt/spark
      SPARK_SUBMIT_OPTS: "-Duser.home=/opt/spark"
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
      - spark-ivy:/opt/spark/.ivy2.5.2
    depends_on:
      kafka:
        condition: service_started
      init-permissions:
        condition: service_completed_successfully

  spark-worker-1:
    image: spark:4.2.0-python3
    hostname: spark-worker-1
    container_name: rapidgo-spark-worker-1
    environment:
      HOME: /opt/spark
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    ports:
      - "8081:8081"
    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
      - spark-ivy:/opt/spark/.ivy2.5.2
    depends_on:
      spark-master:
        condition: service_started

  spark-worker-2:
    image: spark:4.2.0-python3
    hostname: spark-worker-2
    container_name: rapidgo-spark-worker-2
    environment:
      HOME: /opt/spark
    command:
      - /bin/sh
      - -c
      - |
        umask 0002
        exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --cores 2 --memory 2g --webui-port 8081
    ports:
      - "8082:8081"
    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./datalake:/opt/spark/work-dir/datalake
      - spark-ivy:/opt/spark/.ivy2.5.2
    depends_on:
      spark-master:
        condition: service_started
    
  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    image: rapidgo-airflow:3.3.2
    hostname: airflow
    container_name: rapidgo-airflow
    command: bash -c "umask 0002 && exec airflow standalone"
    group_add:
      - "185"
    ports:
      - "8083:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: "America/Bogota"
      RAPIDGO_RAW_PATH: "/opt/airflow/datalake/processed"
      RAPIDGO_CURATED_PATH: "/opt/airflow/datalake/curated"
      RAPIDGO_REPORT_PATH: "/opt/airflow/datalake/reports"
    volumes:
      - ./airflow:/opt/airflow
      - ./datalake:/opt/airflow/datalake
    depends_on:
      init-permissions:
        condition: service_completed_successfully

volumes:
  spark-ivy: